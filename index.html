<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern Spotter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--bg:#ece9f7;--card:#fff;--ink:#241a52;--mut:#6b6394;--line:#cfc8ea;--acc:#ffb400;--accink:#3a2600;--ok:#1f9d6b;--bad:#d6455d;--mark:#ffe08a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1540;--card:#2a2260;--ink:#f1eeff;--mut:#a69fd1;--line:#41388a;--accink:#3a2600;--ok:#4cd6a0;--bad:#ff7d92;--mark:#6a5410;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1540;--card:#2a2260;--ink:#f1eeff;--mut:#a69fd1;--line:#41388a;--accink:#3a2600;--ok:#4cd6a0;--bad:#ff7d92;--mark:#6a5410;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:44px;line-height:1;margin:8px 0 6px;font-weight:800;letter-spacing:-1.5px}
h2{font-size:22px;margin:0 0 10px;font-weight:800}
p{margin:0 0 12px}
.mut{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.btn{font:inherit;font-weight:800;font-size:18px;border:2px solid var(--ink);border-bottom-width:5px;background:var(--acc);color:var(--accink);border-radius:14px;padding:12px 20px;cursor:pointer}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);width:100%}
.q{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px;margin-bottom:16px;font-size:20px;line-height:1.45}
.q small{display:block;color:var(--mut);font-size:14px;margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:700;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt kbd{font:700 13px inherit;color:var(--mut);border:1.5px solid var(--line);border-radius:6px;padding:0 6px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.opt:disabled{cursor:default}
mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 3px}
.rev{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--ok);border-radius:14px;padding:14px;margin-bottom:14px}
.rev.bad{border-left-color:var(--bad)}
.rev .trap{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--mark)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:14px 0}
.node{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.node b{display:block;margin-bottom:6px}
.node .m{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.node .m i{display:block;height:100%}
.node span{font-size:13px;color:var(--mut)}
.gold{border-color:var(--acc)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .1s linear}}
pre{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;font:500 14px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:10px 0}.tag{font-size:13px;font-weight:800;border-radius:8px;padding:1px 10px;background:var(--mark)}ul{padding-left:20px;margin:0 0 12px}
.sel{border-color:var(--ink);background:var(--mark)}.btn:disabled{opacity:.5;cursor:default}table td,table th{padding:4px 6px;border-bottom:1px solid var(--line)}
.lnk{color:var(--ink);text-decoration:underline;cursor:pointer;font-weight:700}

.dots{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.dot.on{border-color:var(--ink);border-width:3px}
.dot.done{background:var(--acc);color:var(--accink);border-color:var(--ink)}
.step{font-size:18px;margin:6px 0 10px}
.blocks{display:grid;gap:10px}
.block{font:inherit;font-size:17px;font-weight:700;text-align:left;min-height:56px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);cursor:pointer;line-height:1.35}
.block.sel{border-color:var(--ink);background:var(--mark)}
.block:active{transform:translateY(2px)}
.codetop{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px 10px;padding:8px 16px 8px;border-bottom:2px solid var(--line)}
.codetop pre{margin:4px 0 0;max-height:22vh;overflow:auto;font-size:13px;line-height:1.45;padding:8px 10px}
.codetop .probname{font-size:16px;margin:0 0 2px}
.codetop .probdesc{font-size:13px;color:var(--mut);margin:0 0 6px;line-height:1.4}
.step{font-size:18px;margin:8px 0 10px}
.footer{position:sticky;bottom:0;margin:18px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.footer .btn:disabled{opacity:.45}
</style>
</head>
<body>
<div id="app"></div>
<script>
var P={hash:"Hash Map",arr:"Arrays & Prefix",mat:"Matrix",two:"Two Pointers",win:"Sliding Window",bs:"Binary Search",ll:"Linked List",stk:"Stack",tree:"Tree DFS/BFS",graph:"Graph & Grid",dp:"Dynamic Programming",gr:"Greedy & Intervals",heap:"Heap",bt:"Backtracking",bit:"Bit Tricks",trie:"Trie"};
// [name, pattern, statement, signals (|), template tip, trapPattern, trapNote]
var D=[
["Two Sum","hash","Return the indices of two numbers in an array that add up to a target.","indices|add up to a target","Store each value in a map; for every x look up target − x."],
["Contains Duplicate","hash","Return true if any value appears at least twice in the array.","appears at least twice","Add to a set as you scan; a repeat means true."],
["Valid Anagram","hash","Check whether one string is a rearrangement of another.","rearrangement","Count letters in a map or array and compare."],
["Group Anagrams","hash","Group strings that are rearrangements of each other.","Group|rearrangements","Key each word by its sorted letters or letter counts."],
["Longest Consecutive Sequence","hash","Find the length of the longest run of consecutive integers in an unsorted array, in O(n).","unsorted|O(n)","Put everything in a set; only start counting at numbers with no x − 1.","gr","Sorting is the obvious move, but O(n) rules it out."],
["Valid Palindrome","two","Check if a string reads the same forwards and backwards, ignoring non-alphanumeric characters.","reads the same forwards and backwards","Pointers at both ends, skip junk, compare, move inward."],
["3Sum","two","Find all unique triplets in an array that sum to zero.","unique triplets|sum to zero","Sort, fix one number, run two pointers on the rest, skip duplicates."],
["Container With Most Water","two","Given vertical lines at each index, pick two that hold the most water.","pick two|most","Start at both ends; always move the shorter side inward."],
["Best Time to Buy and Sell Stock","gr","Given daily prices, find the maximum profit from one buy followed by one later sell.","one buy|later sell","Track the minimum price so far and the best profit at each day.","win","Often filed under Sliding Window, but a running minimum is all you need."],
["Longest Substring Without Repeating Characters","win","Find the length of the longest substring with no repeated characters.","longest substring|no repeated","Expand right; when a repeat appears, shrink left until valid."],
["Longest Repeating Character Replacement","win","Find the longest substring you can make uniform by replacing at most k characters.","longest substring|at most k","Window is valid while size − maxFreq ≤ k; otherwise shrink."],
["Minimum Window Substring","win","Find the smallest substring of s that contains every character of t.","smallest substring|contains every","Expand until valid, then shrink while still valid, recording the best."],
["Valid Parentheses","stk","Check that every opening bracket is closed by the correct type in the correct order.","correct order","Push openers; on a closer, the top of the stack must match."],
["Reverse Linked List","ll","Reverse a singly linked list.","singly linked list","Walk with prev, cur, next and flip each pointer."],
["Linked List Cycle","ll","Detect whether a linked list loops back on itself using O(1) memory.","loops back|O(1) memory","Slow moves 1, fast moves 2; if they meet there is a cycle.","hash","A set works, but O(1) memory points to fast and slow pointers."],
["Remove Nth Node From End of List","ll","Remove the nth node from the end of a linked list in one pass.","from the end|one pass","Move fast n steps ahead, then move both until fast ends.","two","It is a two-pointer gap on a linked list."],
["Merge k Sorted Lists","heap","Merge k sorted linked lists into one sorted list.","k sorted","Keep a min-heap of each list’s head; pop the smallest, push its next.","ll","It involves lists, but the k-way merge is the heap’s job."],
["Invert Binary Tree","tree","Swap the left and right child of every node in a binary tree.","every node","Recurse: swap children, then invert both subtrees."],
["Maximum Depth of Binary Tree","tree","Return the number of nodes along the longest root-to-leaf path.","root-to-leaf","1 + max(depth(left), depth(right))."],
["Binary Tree Level Order Traversal","tree","Return the node values of a binary tree level by level.","level by level","BFS with a queue; process one level’s size at a time."],
["Validate Binary Search Tree","tree","Check that every node’s left subtree is smaller and right subtree is larger.","every node’s|subtree","Recurse with a (low, high) bound for each node."],
["Kth Smallest Element in a BST","tree","Find the kth smallest value in a binary search tree.","binary search tree|kth smallest","In-order traversal visits values in sorted order; stop at k."],
["Number of Islands","graph","Count connected groups of land cells in a grid of 1s and 0s.","connected groups|grid","Scan the grid; each unseen land cell starts a DFS/BFS flood fill."],
["Course Schedule","graph","Given prerequisite pairs, decide whether all courses can be finished.","prerequisite pairs","Build a graph; topological sort or cycle detection decides it."],
["Climbing Stairs","dp","Count the distinct ways to reach step n taking 1 or 2 steps at a time.","Count the distinct ways|1 or 2 steps","dp[i] = dp[i−1] + dp[i−2]."],
["House Robber","dp","Maximize money from houses in a row without robbing two adjacent houses.","Maximize|adjacent","dp[i] = max(dp[i−1], dp[i−2] + money[i])."],
["Coin Change","dp","Find the fewest coins needed to make an amount, or −1 if impossible.","fewest coins|amount","dp[a] = 1 + min(dp[a − coin]) over all coins.","gr","Greedy fails for arbitrary coin sets; you need DP."],
["Longest Increasing Subsequence","dp","Find the length of the longest strictly increasing subsequence.","subsequence","dp[i] = 1 + max(dp[j]) for smaller j, or patience sorting with binary search."],
["Longest Palindromic Substring","dp","Return the longest palindromic substring of a string.","palindromic substring","Expand around every center, or dp[i][j] over substrings.","two","It looks like two pointers, but a single scan from the ends won’t work."],
["Word Break","dp","Decide whether a string can be split into words from a dictionary.","can be split|dictionary","dp[i] is true if some j < i has dp[j] true and s[j:i] is a word."],
["Maximum Subarray","dp","Find the contiguous subarray with the largest sum.","contiguous subarray|largest sum","Kadane: cur = max(x, cur + x); track the best."],
["Jump Game","gr","Starting at index 0, each value is your max jump length; can you reach the last index?","max jump length|reach the last index","Track the farthest index reachable; fail if you fall behind it.","dp","DP works, but a single farthest-reach variable is enough."],
["Merge Intervals","gr","Merge all overlapping intervals.","overlapping intervals","Sort by start; extend the last interval or start a new one."],
["Meeting Rooms II","heap","Find the minimum number of rooms needed for a set of meeting time intervals.","minimum number of rooms","Sort by start; a min-heap of end times frees rooms as meetings finish.","gr","Interval problems are usually greedy, but the heap tracks live meetings."],
["Search in Rotated Sorted Array","bs","Find a target in a sorted array that was rotated, in O(log n).","sorted|O(log n)","Binary search; decide which half is sorted, then which half holds the target."],
["Top K Frequent Elements","heap","Return the k most frequent elements of an array.","k most frequent","Count with a map, then a size-k min-heap or bucket sort.","hash","Counting is a hash map step; the top-k selection is the heap."],
["Find Median from Data Stream","heap","Support adding numbers and reading the median at any time.","adding numbers|median","Max-heap for the lower half, min-heap for the upper half; balance sizes."],
["Implement Trie (Prefix Tree)","trie","Design a structure supporting insert, search and startsWith for strings.","startsWith","Each node holds children by character and an end-of-word flag."],
["Word Search","bt","Determine whether a word can be traced through adjacent cells in a grid.","traced|adjacent cells","DFS from each cell; mark visited, recurse, then unmark.","graph","It is a grid, but the unmark-on-return step makes it backtracking."],
["Number of 1 Bits","bit","Count the set bits in an integer.","set bits","n &= n − 1 clears the lowest set bit; count the loops."],
["Missing Number","bit","An array holds n distinct numbers from 0 to n; find the one missing.","distinct numbers|missing","XOR all indices and values, or sum 0..n minus the array sum.","hash","A set works, but XOR or arithmetic uses O(1) space."],
["Sum of Two Integers","bit","Add two integers without using + or −.","without using","XOR gives the sum without carry; AND shifted left gives the carry. Repeat."],
["Encode and Decode Strings","arr","Design encode and decode so a list of strings survives being sent as one string, even if the strings contain any character.","one string|any character","Prefix each string with its length and a delimiter, like 4#abcd. Decoding reads the length first.","hash","Joining with a separator breaks when a string contains that separator; length prefixes cannot break."],
["Product of Array Except Self","arr","Return an array where each entry is the product of all other elements, without division and in O(n).","all other elements|without division","Build prefix products from the left, then multiply by suffix products from the right in a second pass."],
["Find Minimum in Rotated Sorted Array","bs","Find the minimum of a sorted array that was rotated, in O(log n).","rotated|O(log n)","Compare a[mid] with a[hi]: if bigger, go right (lo = mid + 1); otherwise hi = mid."],
["Reorder List","ll","Reorder a linked list L0, L1, ..., Ln into L0, Ln, L1, Ln-1, ... in place.","Reorder|in place","Find the middle with slow and fast pointers, reverse the second half, then merge the halves alternately."],
["Lowest Common Ancestor of a Binary Search Tree","tree","Find the lowest node that has both p and q as descendants in a binary search tree.","lowest node|binary search tree","Walk down: both values smaller go left, both larger go right, otherwise the current node is the answer."],
["Construct Binary Tree from Preorder and Inorder Traversal","tree","Rebuild a binary tree from its preorder and inorder traversal arrays.","preorder and inorder","The first preorder value is the root. Find it in inorder (use a map) to split left and right, then recurse."],
["Design Add and Search Words Data Structure","trie","Design a structure that adds words and searches them, where a dot can match any letter.","dot can match any letter","A trie plus DFS: on a dot, try every child at that node.","hash","A hash set cannot handle wildcards well; a trie lets you branch."],
["Clone Graph","graph","Return a deep copy of a connected undirected graph given one node.","deep copy","DFS or BFS with a map from each old node to its clone, so every node is copied once and cycles are safe."],
["Pacific Atlantic Water Flow","graph","Find all grid cells from which water can flow to both the Pacific and Atlantic oceans.","both the Pacific and Atlantic","Reverse the flow: multi-source DFS or BFS uphill from each ocean border, then intersect the two sets."],
["Graph Valid Tree","graph","Given n nodes and a list of undirected edges, check whether they form a valid tree.","valid tree","A tree has exactly n − 1 edges and is connected. Use union-find or DFS to check for cycles."],
["Number of Connected Components in an Undirected Graph","graph","Count the connected components in an undirected graph with n nodes and a list of edges.","connected components","Union-find (count successful merges) or DFS from each unvisited node."],
["House Robber II","dp","Houses are arranged in a circle; maximize money without robbing two adjacent houses.","in a circle|adjacent","Run House Robber twice, once without the first house and once without the last, and take the max."],
["Palindromic Substrings","dp","Count how many substrings of a string are palindromes.","Count|palindromes","Expand around each center (odd and even) and count every successful expansion.","two","It reuses the expand-around-center idea, but you count each expansion instead of tracking the longest."],
["Decode Ways","dp","Count the ways to decode a digit string where 1 to 26 map to letters A to Z.","Count the ways|decode","dp[i] adds dp[i−1] if one digit is valid and dp[i−2] if two digits are valid. Watch the zeros."],
["Maximum Product Subarray","dp","Find the contiguous subarray with the largest product.","contiguous subarray|largest product","Track both the max and min product ending here, because a negative number can turn the min into the max."],
["Longest Common Subsequence","dp","Find the length of the longest subsequence common to two strings.","subsequence|two strings","2D dp: if letters match, dp[i−1][j−1] + 1; otherwise the max of dropping a letter from either string."],
["Unique Paths","dp","Count the paths from the top-left to the bottom-right of a grid moving only right or down.","Count the paths|only right or down","dp[r][c] = dp[r−1][c] + dp[r][c−1]. The first row and column are all 1."],
["Combination Sum IV","dp","Count the ordered sequences of numbers that add up to a target.","ordered sequences|add up to a target","dp[t] = sum of dp[t − x] over every x. Loop the target outside and the numbers inside to count orderings.","bt","It looks like backtracking, but you only need the count, so DP avoids enumerating."],
["Insert Interval","gr","Insert a new interval into a sorted list of non-overlapping intervals and merge if needed.","sorted|new interval","Copy intervals ending before the new one, merge the overlapping ones with min start and max end, then copy the rest."],
["Non-overlapping Intervals","gr","Find the minimum number of intervals to remove so the rest do not overlap.","minimum number|remove","Sort by end time and keep the interval that ends earliest; count the ones that conflict.","dp","DP works, but sorting by end time and keeping the earliest finish is simpler."],
["Set Matrix Zeroes","mat","If a cell in a matrix is zero, set its entire row and column to zero in place.","entire row and column|in place","Use the first row and first column as markers to get O(1) extra space."],
["Spiral Matrix","mat","Return all elements of a matrix in spiral order.","spiral order","Keep four boundaries (top, bottom, left, right); walk each side, then shrink that boundary."],
["Rotate Image","mat","Rotate an n × n matrix 90 degrees clockwise in place.","90 degrees clockwise|in place","Transpose the matrix, then reverse each row."],
["Binary Tree Maximum Path Sum","tree","Find the maximum sum of a path in a binary tree. A path can start and end at any node.","any node","At each node, return the best path going down one side, and update a global best with node + left + right (ignore negative branches).","dp","It looks like a DP over the tree, and it is one, but the return value must use only one side."],
["Serialize and Deserialize Binary Tree","tree","Design a way to convert a binary tree to a string and back so the same tree is rebuilt exactly.","convert a binary tree to a string","Use a preorder DFS that writes a marker for each null child; deserialize by reading the tokens in the same order, recursively."],
["Word Search II","trie","Find all words from a list that can be built by walking adjacent cells in a grid.","all words from a list|adjacent cells","Build a trie of the words, then DFS the grid while following trie children, and prune any branch with no child.","bt","It has backtracking, but the trie is what keeps it fast."],
["Alien Dictionary","graph","Given words sorted in an alien language, find the order of its letters.","sorted in an alien language","Take the first differing letter of each adjacent word pair as an edge, then topologically sort; a cycle means no valid order."],
["Merge Two Sorted Lists","ll","Merge two sorted linked lists into one sorted list.","sorted linked lists","Use a dummy head; repeatedly attach the smaller current node from either list, then attach whatever is left over."],
["Same Tree","tree","Check whether two binary trees are identical in structure and node values.","identical in structure and node values","Recurse on both trees together: if both nodes are null return true; if one is null or the values differ return false; otherwise check left and right."],
["Subtree of Another Tree","tree","Check whether one binary tree is a subtree of another.","is a subtree of another","For each node of the big tree, run Same Tree against the small tree; return true if any match."],
["Meeting Rooms","gr","Given meeting time intervals, decide whether one person can attend all of them without overlap.","without overlap","Sort by start time; if any meeting starts before the previous one ends, return false."],
["Counting Bits","bit","For every number from 0 to n, count its set bits and return the array.","set bits","dp[i] = dp[i >> 1] + (i & 1): each count reuses the count of a smaller number."],
["Reverse Bits","bit","Reverse the bits of a 32-bit unsigned integer.","32-bit unsigned integer","Loop 32 times: shift the result left, add the lowest bit of n, then shift n right."]
];
var K="patternSpotterV1",S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{xp:0,streak:0,last:"",best:0,m:{}};
S.l=S.l||{};S.b=S.b||{};S.m=S.m||{};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var app=document.getElementById("app"),R=null,TL=15000,tm=null;
function lvl(){return Math.floor(S.xp/100)+1}
function mast(p){return S.m[p]||0}
function hue(i){return "hsl("+(i*47+250)%360+",65%,50%)"}
var LVN=["Not started","Spot it","Know why","Build it"];
function plevel(p){
  var st=(S.st||{})[p]||[0,0],acc=st[0]?st[1]/st[0]:0,l=0;
  if(st[0]>=5&&acc>=.7)l=1;
  if(l>=1&&(!L[p]||(S.l&&S.l[p]||0)>=L[p].steps.length))l=2;
  if(l>=2&&BL[p]&&Object.keys(S.b||{}).some(function(k){return S.b[k]&&k.indexOf(p)==0&&!isNaN(+k.slice(p.length))}))l=3;
  return l;
}
function tip(p,l){
  if(l==0)return {t:L[p]?"Learn "+P[p]:"Quiz "+P[p],a:function(){L[p]?lesson(p):start(p,null,5)}};
  if(l==1)return {t:"Finish the "+P[p]+" lesson",a:function(){lesson(p)}};
  return BL[p]?{t:"Build the logic for "+P[p],a:function(){bld(p,0)}}:{t:"Quiz "+P[p],a:function(){start(p,null,5)}};
}
function home(){
  clearInterval(tm);R=null;
  var best=null;
  Object.keys(P).forEach(function(p){
    if(!D.some(function(d){return d[1]==p}))return;
    var l=plevel(p);if(l<3&&(!best||l<best.l))best={p:p,l:l};
  });
  var nx=best?tip(best.p,best.l).t:"Today's quiz";
  app.innerHTML='<h1>Pattern Spotter</h1>'+
  
  '<div class="row" style="margin:14px 0"><div class="stat"><b>'+S.streak+'</b>day streak</div><div class="stat"><b>'+S.xp+'</b>XP</div></div>'+
  '<div class="row" style="margin-top:12px"><button class="btn alt" id="l1" style="flex:1;font-size:22px;padding:20px">My path</button><button class="btn alt" id="play" style="flex:1;font-size:22px;padding:20px">Quiz</button></div>'+
  '';
  on("play",function(){start(null,null,5)});on("l1",mapv);
}
function ladderDone(p){return !!L[p]&&(S.l&&S.l[p]||0)>=L[p].steps.length}
function prog(p,l,st){
  var q=l>=1?1:Math.min(st[0]/5,1)*Math.min((st[0]?st[1]/st[0]:0)/.7,1),
      ld=L[p]?Math.min(1,(S.l[p]||0)/L[p].steps.length):q,
      b=BL[p]?(l>=3?1:0):ld;
  return Math.round((q+ld+b)/3*100);
}
var BTN='class="btn alt" style="font-size:14px;padding:6px 12px"';
function mapv(){
  var h='<div class="top"><h2>My learning path</h2><button class="btn alt" id="bk" style="font-size:14px;padding:6px 12px">Home</button></div>'+
  '<p class="mut">Each pattern moves up as you quiz: Spot it, then Know why, then Build it.</p>';
